<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="bg3" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f0a1f"/>
      <stop offset="100%" stop-color="#050508"/>
    </radialGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="30%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <filter id="nodeGlow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="lineGlow"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg3)"/>
  <rect width="600" height="600" fill="url(#centerGlow)"/>
  <!-- Grid -->
  <g stroke="#7c3aed" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="100" x2="600" y2="100"/><line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="300" x2="600" y2="300"/><line x1="0" y1="400" x2="600" y2="400"/>
    <line x1="0" y1="500" x2="600" y2="500"/>
    <line x1="100" y1="0" x2="100" y2="600"/><line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/><line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="500" y1="0" x2="500" y2="600"/>
  </g>
  <!-- Layer 1 nodes (input) -->
  <g opacity="0.9">
    <circle cx="80" cy="150" r="16" fill="#7c3aed" filter="url(#nodeGlow)"/>
    <circle cx="80" cy="230" r="16" fill="#7c3aed" filter="url(#nodeGlow)"/>
    <circle cx="80" cy="310" r="16" fill="#7c3aed" filter="url(#nodeGlow)"/>
    <circle cx="80" cy="390" r="16" fill="#7c3aed" filter="url(#nodeGlow)"/>
    <circle cx="80" cy="470" r="16" fill="#7c3aed" filter="url(#nodeGlow)"/>
  </g>
  <!-- Layer 2 nodes (hidden 1) -->
  <g opacity="0.85">
    <circle cx="210" cy="110" r="14" fill="#9333ea" filter="url(#nodeGlow)"/>
    <circle cx="210" cy="210" r="14" fill="#9333ea" filter="url(#nodeGlow)"/>
    <circle cx="210" cy="310" r="14" fill="#9333ea" filter="url(#nodeGlow)"/>
    <circle cx="210" cy="410" r="14" fill="#9333ea" filter="url(#nodeGlow)"/>
    <circle cx="210" cy="510" r="14" fill="#9333ea" filter="url(#nodeGlow)"/>
  </g>
  <!-- Layer 3 nodes (hidden 2) -->
  <g opacity="0.9">
    <circle cx="340" cy="150" r="16" fill="#06b6d4" filter="url(#nodeGlow)"/>
    <circle cx="340" cy="250" r="16" fill="#06b6d4" filter="url(#nodeGlow)"/>
    <circle cx="340" cy="350" r="16" fill="#06b6d4" filter="url(#nodeGlow)"/>
    <circle cx="340" cy="450" r="16" fill="#06b6d4" filter="url(#nodeGlow)"/>
  </g>
  <!-- Layer 4 nodes (hidden 3) -->
  <g opacity="0.85">
    <circle cx="460" cy="190" r="14" fill="#0891b2" filter="url(#nodeGlow)"/>
    <circle cx="460" cy="310" r="14" fill="#0891b2" filter="url(#nodeGlow)"/>
    <circle cx="460" cy="430" r="14" fill="#0891b2" filter="url(#nodeGlow)"/>
  </g>
  <!-- Layer 5 nodes (output) -->
  <g opacity="0.95">
    <circle cx="560" cy="230" r="18" fill="#06b6d4" filter="url(#nodeGlow)"/>
    <circle cx="560" cy="310" r="18" fill="#7c3aed" filter="url(#nodeGlow)"/>
    <circle cx="560" cy="390" r="18" fill="#06b6d4" filter="url(#nodeGlow)"/>
  </g>
  <!-- Connections L1 → L2 -->
  <g stroke="#7c3aed" stroke-width="0.8" stroke-opacity="0.25">
    <line x1="96" y1="150" x2="196" y2="110"/><line x1="96" y1="150" x2="196" y2="210"/>
    <line x1="96" y1="150" x2="196" y2="310"/><line x1="96" y1="150" x2="196" y2="410"/>
    <line x1="96" y1="230" x2="196" y2="110"/><line x1="96" y1="230" x2="196" y2="210"/>
    <line x1="96" y1="230" x2="196" y2="310"/><line x1="96" y1="230" x2="196" y2="510"/>
    <line x1="96" y1="310" x2="196" y2="210"/><line x1="96" y1="310" x2="196" y2="310"/>
    <line x1="96" y1="310" x2="196" y2="410"/><line x1="96" y1="390" x2="196" y2="310"/>
    <line x1="96" y1="390" x2="196" y2="410"/><line x1="96" y1="390" x2="196" y2="510"/>
    <line x1="96" y1="470" x2="196" y2="410"/><line x1="96" y1="470" x2="196" y2="510"/>
  </g>
  <!-- Connections L2 → L3 -->
  <g stroke="#9333ea" stroke-width="0.8" stroke-opacity="0.25">
    <line x1="224" y1="110" x2="324" y2="150"/><line x1="224" y1="110" x2="324" y2="250"/>
    <line x1="224" y1="210" x2="324" y2="150"/><line x1="224" y1="210" x2="324" y2="250"/>
    <line x1="224" y1="210" x2="324" y2="350"/><line x1="224" y1="310" x2="324" y2="250"/>
    <line x1="224" y1="310" x2="324" y2="350"/><line x1="224" y1="410" x2="324" y2="350"/>
    <line x1="224" y1="410" x2="324" y2="450"/><line x1="224" y1="510" x2="324" y2="450"/>
  </g>
  <!-- Connections L3 → L4 -->
  <g stroke="#06b6d4" stroke-width="0.8" stroke-opacity="0.3">
    <line x1="356" y1="150" x2="446" y2="190"/><line x1="356" y1="250" x2="446" y2="190"/>
    <line x1="356" y1="250" x2="446" y2="310"/><line x1="356" y1="350" x2="446" y2="310"/>
    <line x1="356" y1="350" x2="446" y2="430"/><line x1="356" y1="450" x2="446" y2="430"/>
  </g>
  <!-- Connections L4 → L5 (highlighted) -->
  <g stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.5">
    <line x1="474" y1="190" x2="542" y2="230"/><line x1="474" y1="310" x2="542" y2="310"/>
    <line x1="474" y1="430" x2="542" y2="390"/>
  </g>
  <!-- Highlighted active path -->
  <line x1="96" y1="310" x2="196" y2="310" stroke="#7c3aed" stroke-width="2.5" stroke-opacity="0.8" filter="url(#lineGlow)"/>
  <line x1="224" y1="310" x2="324" y2="350" stroke="#9333ea" stroke-width="2.5" stroke-opacity="0.8" filter="url(#lineGlow)"/>
  <line x1="356" y1="350" x2="446" y2="310" stroke="#06b6d4" stroke-width="2.5" stroke-opacity="0.8" filter="url(#lineGlow)"/>
  <line x1="474" y1="310" x2="542" y2="310" stroke="#06b6d4" stroke-width="3" stroke-opacity="1" filter="url(#nodeGlow)"/>
  <!-- Labels -->
  <text x="80" y="530" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#94a3b8">INPUT</text>
  <text x="210" y="545" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#94a3b8">HIDDEN 1</text>
  <text x="340" y="490" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#94a3b8">HIDDEN 2</text>
  <text x="460" y="470" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#94a3b8">HIDDEN 3</text>
  <text x="560" y="430" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#94a3b8">OUTPUT</text>
  <text x="300" y="575" text-anchor="middle" font-family="Inter,sans-serif" font-size="14" fill="#94a3b8" letter-spacing="3">DEEP NEURAL NETWORK</text>
</svg>
